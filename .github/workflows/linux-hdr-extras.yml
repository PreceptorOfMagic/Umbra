name: Linux HDR extras

on:
  push:
    branches: [claude/great-pascal-njfsyf]
    paths:
      - .github/workflows/linux-hdr-extras.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cachyos:
    name: CachyOS packaging of KWin and Mutter
    runs-on: ubuntu-24.04
    container: cachyos/cachyos-v3:latest
    steps:
      - name: Query
        shell: bash
        run: |
          set -x
          ls /etc/pacman.d
          grep -vE '^\s*(#|$)' /etc/pacman.conf
          head -5 /etc/pacman.d/cachyos-v3-mirrorlist /etc/pacman.d/cachyos-mirrorlist || true
          pacman -Sy --noconfirm git >/dev/null
          git clone -q --depth 1 https://github.com/CachyOS/CachyOS-PKGBUILDS /tmp/cp
          ls /tmp/cp | grep -iE 'mutter|kwin|gnome-shell' || true
          for d in /tmp/cp/*mutter* /tmp/cp/*kwin*; do
            [ -d "$d" ] || continue
            echo "== $d"; ls "$d"
            grep -E '^(pkgname|pkgbase|pkgver|pkgrel|epoch|_commit|_tag)=' "$d/PKGBUILD"
            sed -n '/^source=/,/)/p' "$d/PKGBUILD"
            grep -nE 'patch|git apply|meson|prepare\(' "$d/PKGBUILD" | head -40
          done
          for v in v4 znver4; do
            for u in "https://mirror.cachyos.org/repo/x86_64_v4/cachyos-extra-$v/cachyos-extra-$v.db" \
                     "https://cdn77.cachyos.org/repo/x86_64_v4/cachyos-extra-$v/cachyos-extra-$v.db"; do
              if curl -fsSL -o /tmp/$v.db "$u"; then
                echo "$u"; tar -tf /tmp/$v.db | grep -E '^(kwin|mutter|qt6-base)-[0-9]' | grep /$ ; break
              fi
            done
          done
